<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NetCity - Full Window (Dev)</title>
  <link rel="stylesheet" href="./game/game.css">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #0d1b2a;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    #game-container {
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>
  <div id="game-container"></div>
  <script type="module">
    import { mountGame, BrowserHostAdapter } from './game/index.js';

    const host = new BrowserHostAdapter({
      onExit: () => {
        window.location.href = './host-demo.html';
      }
    });

    const container = document.getElementById('game-container');
    mountGame(container, host);
  </script>
</body>
</html>
